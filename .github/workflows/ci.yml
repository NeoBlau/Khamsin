name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Кеш движка
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Поставить Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSLo godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Запуск как в README
        # На чистом чекауте нет каталога .godot, а значит нет кеша глобальных
        # классов: автолоады не компилируются и игра уходит в поток ошибок.
        # Проверяем ровно тот путь, которым игру запускает человек. Шаг обязан
        # стоять до тестов: tools/test.sh импортирует проект сам и после него
        # чистоты чекаута уже нет.
        run: |
          export PATH="$HOME/godot:$PATH"
          timeout 120 tools/run.sh --headless > run.log 2>&1 || true
          if grep -qE "SCRIPT ERROR|Failed to instantiate an autoload" run.log; then
            echo "::error::Игра не поднимается на чистом чекауте"
            grep -E "SCRIPT ERROR|Parse Error|Failed to instantiate" run.log | head -20
            exit 1
          fi
          echo "Чистый чекаут запускается без ошибок скриптов."

      - name: Прогнать тесты
        run: |
          export PATH="$HOME/godot:$PATH"
          GODOT="$HOME/godot/godot" tools/test.sh

      - name: Стенд телеметрии
        # Не проверка, а сводка: разгон, тормозной путь, влияние давления.
        # Полезно видеть в логе сборки, как настройки машины поехали.
        run: |
          "$HOME/godot/godot" --headless --path . \
            res://tools/bench_vehicle.tscn 2>&1 | grep -v "^ERROR\|^WARNING" || true
